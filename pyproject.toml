[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "montador-uch"
version = "1.0.0"
description = "Builder for the DESSEM hydraulic unit commitment input file (uch.csv)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "idessem @ git+https://github.com/carlosribeiro06/idessem.git@da2118e",
    "pandas>=3.0",
    "openpyxl>=3.1",
    "rich>=13",
]

[project.scripts]
montador-uch = "montador_uch.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/montador_uch"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["montador_uch", "helpers"]
# rules/python.md mandates `from __future__ import annotations` in every module; enforce it
# mechanically so it cannot drift.
required-imports = ["from __future__ import annotations"]

[tool.mypy]
strict = true
mypy_path = "src"

# idessem.dessem re-exports its file classes without an __all__, so strict mode rejects
# `from idessem.dessem import Uch` even though that is the package's documented entry point.
[[tool.mypy.overrides]]
module = ["idessem.dessem"]
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode keeps the repository root off sys.path, so tests always exercise the
# installed montador_uch package rather than anything shadowing it from the root.
addopts = "-q --import-mode=importlib"
pythonpath = ["src", "tests"]
